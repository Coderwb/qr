<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-kod Generator</title>
    <!-- Vi använder qrcode.js för att skapa QR-koder -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; max-width: 400px; margin: auto; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { width: 80%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #qrcode { margin-top: 20px; display: flex; justify-content: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Skapa din QR-kod</h2>
    <input type="url" id="urlInput" placeholder="Klistra in länk här (t.ex. https://google.com)">
    <br>
    <button onclick="generateQR()">Skapa QR-kod</button>
    <div id="qrcode"></div>
</div>

<script>
    let qrcode = null;
    function generateQR() {
        const url = document.getElementById('urlInput').value;
        const qrContainer = document.getElementById('qrcode');
        
        if (!url) {
            alert('Vänligen fyll i en webbadress.');
            return;
        }
        
        // Töm tidigare QR-kod om den finns
        qrContainer.innerHTML = '';
        
        // Skapa ny QR-kod
        qrcode = new QRCode(qrContainer, {
            text: url,
            width: 200,
            height: 200
        });
    }
</script>

</body>
</html>
